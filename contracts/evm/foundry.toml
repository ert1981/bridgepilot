[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false
